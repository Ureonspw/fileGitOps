# Exemple d'inventaire Ansible pour Dockgit
# Copiez ce fichier vers ansible/inventory.ini et modifiez les valeurs

[dockgit]
192.168.1.100 ansible_user=root ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Pour authentification par mot de passe
[dockgit:vars]
ansible_ssh_pass=your_password_here
ansible_become_pass=your_password_here
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Pour authentification par clé SSH (décommentez et modifiez)
# [dockgit:vars]
# ansible_ssh_private_key_file=/path/to/your/private/key
# ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
