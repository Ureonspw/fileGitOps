# Configuration Ansible globale pour le provisionnement cloud
# Ce fichier optimise les performances et la sécurité

[defaults]
# Inventaire par défaut
inventory = inventory.ini

# Nombre de processus parallèles (ajustez selon vos ressources)
forks = 10

# Timeout pour les connexions SSH
timeout = 30

# Nombre de tentatives pour les connexions
retry_files_enabled = False
retry_files_save_path = ~/.ansible-retry

# Gestion des erreurs
gathering = smart
fact_caching = memory
fact_caching_timeout = 86400

# Logging
log_path = /tmp/ansible.log
display_skipped_hosts = False
display_ok_hosts = True

# Performance
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# Sécurité
host_key_checking = False
remote_user = root

# Variables
vars_plugins_enabled = host_group_vars

[ssh_connection]
# Optimisations SSH
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
control_path_dir = /tmp

[privilege_escalation]
# Configuration sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[colors]
# Couleurs pour l'affichage
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
